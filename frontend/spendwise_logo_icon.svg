<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Neon Green Arrow & Wallet Gradient -->
    <linearGradient id="neonGreenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#69ff97" />
    </linearGradient>

    <!-- Glowing Filter Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Navy Rounded Square Container -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGradient)" stroke="#334155" stroke-width="4" />

  <!-- Wallet Outline Body -->
  <path d="M 120 180 C 120 157.9 137.9 140 160 140 L 320 140 C 342.1 140 360 157.9 360 180 L 360 340 C 360 362.1 342.1 380 320 380 L 160 380 C 137.9 380 120 362.1 120 340 Z" 
        fill="none" 
        stroke="url(#neonGreenGrad)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.9" />

  <!-- Wallet Clasp / Pocket -->
  <path d="M 310 230 L 360 230 C 371 230 380 239 380 250 L 380 270 C 380 281 371 290 360 290 L 310 290 C 299 290 290 281 290 270 L 290 250 C 290 239 299 230 310 230 Z" 
        fill="#0f172a" 
        stroke="url(#neonGreenGrad)" 
        stroke-width="16" />

  <!-- Wallet Clasp Button -->
  <circle cx="335" cy="260" r="10" fill="url(#neonGreenGrad)" />

  <!-- Upward Trending Financial Arrow Icon Merged (With Glow) -->
  <path d="M 100 330 L 190 240 L 250 290 L 390 130" 
        fill="none" 
        stroke="url(#neonGreenGrad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Arrow Head -->
  <path d="M 310 130 L 390 130 L 390 210" 
        fill="none" 
        stroke="url(#neonGreenGrad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
</svg>